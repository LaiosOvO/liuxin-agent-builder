# 公网入口（80 端口）：最小暴露面策略
# 仅放行 3 条路径，其余全部 403
# NET-01 / NET-02 实现
server {
    listen 80 default_server;
    server_name _;

    # 不暴露 nginx 版本（防侦察扫描）
    server_tokens off;

    # 访问日志 & 错误日志
    access_log  /var/log/nginx/public_access.log  main;
    error_log   /var/log/nginx/public_error.log   warn;

    # =============================================
    # 允许路径 1：HITL 决策页（GET-only 显示页面）
    # =============================================
    location ^~ /hitl/page/ {
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # =============================================
    # 允许路径 2：HITL 决策提交（POST 消费 jti）
    # =============================================
    location ^~ /hitl/action/ {
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # =============================================
    # 允许路径 3：IM Webhook 回调（飞书/企微/钉钉/Slack）
    # =============================================
    location ^~ /api/im/webhook/ {
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # =============================================
    # 兜底规则：其他所有路径一律 403
    # 防止 /api/v1/* /admin /docs /metrics 等被扫描
    # =============================================
    location / {
        return 403;
    }
}
