# 公网入口（80）：仅放行 3 条路径，其他 403
# Plan 01-01 占位实现；Plan 01-03 完善规则与扫描脚本
server {
    listen 80 default_server;
    server_name _;

    location ^~ /hitl/page/ {
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    location ^~ /hitl/action/ {
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    location ^~ /api/im/webhook/ {
        proxy_pass http://api:8000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # 兜底 403
    location / {
        return 403;
    }
}
