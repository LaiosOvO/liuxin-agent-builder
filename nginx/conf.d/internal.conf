# 内网管理端（8080 端口）
# 仅 docker-compose 内网或 VPN 可达，不对公网暴露
# NET-01 实现（内网管理通道）
server {
    listen 8080;
    server_name _;

    # 访问日志 & 错误日志（内网，记录详细信息便于调试）
    access_log  /var/log/nginx/internal_access.log  main;
    error_log   /var/log/nginx/internal_error.log   warn;

    # =============================================
    # WebSocket（Phase 2 实时画布预留，EXEC-04 timeline）
    # =============================================
    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 5s;
    }

    # =============================================
    # API 路由 → FastAPI 后端
    # =============================================
    location /api/ {
        proxy_pass http://api:8000/api/;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # =============================================
    # 健康检查（内网 healthcheck 用）
    # =============================================
    location /health {
        proxy_pass http://api:8000/health;
        include /etc/nginx/snippets/proxy_headers.conf;
    }

    # =============================================
    # 根路径 → Next.js 前端（管理界面）
    # =============================================
    location / {
        proxy_pass http://web:3000;
        include /etc/nginx/snippets/proxy_headers.conf;
    }
}
