<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex,nofollow" />
  <title>邮件链接扫描</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 24px;
      color: #333;
      line-height: 1.7;
    }
    h1 {
      color: #444;
      font-size: 20px;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 12px;
    }
    .info {
      background: #f6f8fa;
      border-left: 4px solid #0366d6;
      padding: 16px 20px;
      border-radius: 4px;
      margin: 20px 0;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>您看到的是邮件扫描预览</h1>

  <div class="info">
    <p>系统检测到当前请求来自邮件安全扫描器（如 Outlook Safe Links / Microsoft Defender / Slack 链接预览等）。</p>
    <p><strong>未触发任何状态变更</strong>，您的审批 token 仍然有效，等待真实点击决策。</p>
  </div>

  <p>请通过您的邮件客户端正常打开链接以进行决策。</p>

  <div class="footer">
    <p>此页面为静态响应，不涉及任何业务数据更新。</p>
  </div>
</body>
</html>
