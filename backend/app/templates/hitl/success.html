<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>决策已记录</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 40px;
      text-align: center;
      color: #333;
      line-height: 1.7;
    }
    .icon {
      font-size: 48px;
      color: #28a745;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      color: #24292e;
      margin-bottom: 8px;
    }
    .action-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      background: #f1f8ff;
      color: #0366d6;
      font-weight: 600;
      margin: 8px 0;
    }
    .info {
      color: #586069;
      font-size: 14px;
      margin: 20px 0;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="icon">✓</div>
  <h1>决策已记录</h1>

  <div class="action-tag">
    {% if action == 'submit' %}已提交
    {% elif action == 'approve' %}已通过
    {% elif action == 'return' %}已退回
    {% elif action == 'reject' %}已拒绝
    {% else %}{{ action }}{% endif %}
  </div>

  <div class="info">
    <p>您的审批决策已成功记录并推进流程。</p>
    {% if instance_id %}
    <p style="font-size:12px;color:#6a737d;">流程实例：{{ instance_id }}</p>
    {% endif %}
  </div>

  <div class="footer">
    <p>您可以关闭此页面。</p>
  </div>
</body>
</html>
