# agent-builder Alembic 配置（独立于 flock 原有的 app/alembic）
# 使用路径：backend/ 目录下运行 alembic -c migrations/alembic.ini upgrade head

[alembic]
# 迁移脚本位置（相对于 alembic.ini 所在目录）
script_location = %(here)s

# 迁移文件模板变量：%(rev)s_%(slug)s
file_template = %%(rev)s_%%(slug)s

# 时区
timezone = UTC

# 输出编码
output_encoding = utf-8

# Logging 配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
